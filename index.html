<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Trigonométrica</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="auth-container" class="auth-container">
        <div class="auth-box">
            <h1>Calculadora Trigonométrica</h1>
            <p class="welcome-text">Inicia sesión para acceder a la calculadora</p>
            
            <div class="social-login-container">
                <button id="google-login-btn" class="social-btn google-btn">
                    <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Continuar con Google
                </button>
                
                <button id="github-login-btn" class="social-btn github-btn">
                    <svg class="social-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v 3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" fill="#1B1F23"/>
                    </svg>
                    Continuar con GitHub
                </button>
            </div>

            <div class="divider">
                <span>O</span>
            </div>

            <form id="email-form" class="email-form">
                <input type="email" id="email-input" placeholder="tu@email.com" required>
                <input type="password" id="password-input" placeholder="Contraseña" required>
                <button type="submit" class="btn-primary">Acceder</button>
            </form>

            <p class="terms">Al continuar, aceptas nuestros <a href="#">Términos de Servicio</a> y <a href="#">Privacidad</a></p>
        </div>
    </div>

    <div id="app-container" class="app-container" style="display: none;">
        <nav class="navbar">
            <div class="navbar-content">
                <h1>Calculadora Trigonométrica</h1>
                <div class="user-menu">
                    <span id="user-display"></span>
                    <button id="logout-btn" class="btn-logout">Cerrar Sesión</button>
                </div>
            </div>
        </nav>

        <main class="calculator-main">
            <div class="calculator-container">
                <div class="input-section">
                    <h2>Ingresa un ángulo</h2>
                    <div class="angle-input-group">
                        <input type="number" id="angle-input" placeholder="0" step="0.01">
                        <select id="unit-select">
                            <option value="degrees">Grados (°)</option>
                            <option value="radians">Radianes (rad)</option>
                        </select>
                    </div>
                    <button id="calculate-btn" class="btn-primary">Calcular</button>
                </div>

                <div class="results-section">
                    <div class="result-card">
                        <h3>sin(θ)</h3>
                        <p id="result-sin">-</p>
                    </div>
                    <div class="result-card">
                        <h3>cos(θ)</h3>
                        <p id="result-cos">-</p>
                    </div>
                    <div class="result-card">
                        <h3>tan(θ)</h3>
                        <p id="result-tan">-</p>
                    </div>
                    <div class="result-card">
                        <h3>cot(θ)</h3>
                        <p id="result-cot">-</p>
                    </div>
                    <div class="result-card">
                        <h3>sec(θ)</h3>
                        <p id="result-sec">-</p>
                    </div>
                    <div class="result-card">
                        <h3>csc(θ)</h3>
                        <p id="result-csc">-</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="auth.js"></script>
    <script src="calculator.js"></script>
</body>
</html>

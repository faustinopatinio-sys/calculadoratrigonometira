<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesando autenticación...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
        }

        .loading-container {
            text-align: center;
            color: white;
        }

        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 20px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 24px;
            margin: 0;
        }

        p {
            margin-top: 10px;
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="loading-container">
        <div class="spinner"></div>
        <h1>Procesando autenticación...</h1>
        <p>Por favor espera mientras completamos tu inicio de sesión.</p>
    </div>

    <script>
        // Extraer código y state de la URL
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        const error = params.get('error');

        if (error) {
            alert('Error de autenticación: ' + error);
            window.location.href = '/index.html';
        } else if (code && state) {
            // Redirigir a la página principal con los parámetros
            window.location.href = `/index.html?code=${code}&state=${state}`;
        } else {
            alert('Parámetros inválidos');
            window.location.href = '/index.html';
        }
    </script>
</body>
</html>
